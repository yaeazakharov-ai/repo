<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Автозапчасти</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: var(--tg-theme-bg-color, #fff);
    --text: var(--tg-theme-text-color, #000);
    --hint: var(--tg-theme-hint-color, #999);
    --link: var(--tg-theme-link-color, #2678b6);
    --btn: var(--tg-theme-button-color, #2678b6);
    --btn-text: var(--tg-theme-button-text-color, #fff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f1f1f1);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  .header {
    padding: 16px 16px 12px;
    font-size: 18px;
    font-weight: 700;
    border-bottom: 1px solid var(--secondary-bg);
    flex-shrink: 0;
  }

  /* ── Content ── */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── Search tab ── */
  .search-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  input[type="text"], textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1.5px solid var(--secondary-bg);
    background: var(--secondary-bg);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color .2s;
  }
  input[type="text"]:focus, textarea:focus {
    border-color: var(--btn);
  }
  textarea {
    min-height: 80px;
    resize: none;
  }

  .btn {
    padding: 12px 20px;
    border-radius: 12px;
    border: none;
    background: var(--btn);
    color: var(--btn-text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity .15s;
  }
  .btn:active { opacity: .75; }
  .btn.full { width: 100%; margin-top: 8px; }
  .btn.secondary {
    background: var(--secondary-bg);
    color: var(--text);
  }

  /* ── Cards ── */
  .card {
    background: var(--secondary-bg);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .card-title {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 6px;
  }
  .card-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--hint);
    margin-bottom: 3px;
  }
  .card-row span:last-child { color: var(--text); font-weight: 500; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    background: var(--btn);
    color: var(--btn-text);
    margin-top: 6px;
  }
  .badge.gray { background: var(--secondary-bg); color: var(--hint); border: 1px solid var(--hint); }

  /* ── AI chat ── */
  .chat-messages {
    min-height: 160px;
    max-height: 300px;
    overflow-y: auto;
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
  }
  .msg.user {
    background: var(--btn);
    color: var(--btn-text);
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    background: var(--secondary-bg);
    color: var(--text);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .chat-input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  /* ── Hint ── */
  .hint {
    font-size: 13px;
    color: var(--hint);
    text-align: center;
    margin-top: 20px;
    line-height: 1.5;
  }

  /* ── Tabs ── */
  .tabs {
    display: flex;
    border-top: 1px solid var(--secondary-bg);
    flex-shrink: 0;
    background: var(--bg);
  }
  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 4px 12px;
    cursor: pointer;
    border: none;
    background: none;
    color: var(--hint);
    font-size: 10px;
    gap: 4px;
    transition: color .15s;
  }
  .tab.active { color: var(--btn); }
  .tab-icon { font-size: 22px; line-height: 1; }
</style>
</head>
<body>

<div class="header" id="header-title">🔍 Поиск</div>

<div class="content">

  <!-- ── ПОИСК ── -->
  <div class="tab-panel active" id="tab-search">
    <div class="search-row">
      <input type="text" id="search-input" placeholder="Введи артикул..." autocomplete="off">
      <button class="btn" onclick="doSearch()">Найти</button>
    </div>
    <p class="hint">Введи артикул и нажми «Найти».<br>Результат придёт в чат.</p>
  </div>

  <!-- ── ЗАКАЗЫ ── -->
  <div class="tab-panel" id="tab-orders">
    <button class="btn full" onclick="send('orders', {})">📋 Загрузить мои заказы</button>
    <p class="hint">Бот пришлёт список заказов в чат.</p>
  </div>

  <!-- ── СКЛАДЫ ── -->
  <div class="tab-panel" id="tab-info">
    <button class="btn full" onclick="send('userinfo', {})">🏪 Показать склады и менеджера</button>
    <p class="hint">Бот пришлёт информацию об аккаунте в чат.</p>
  </div>

  <!-- ── AI-ЧАТ ── -->
  <div class="tab-panel" id="tab-ai">
    <div class="chat-messages" id="chat-messages">
      <div class="msg bot">Привет! Задай любой вопрос — я отвечу прямо здесь 👋</div>
    </div>
    <div class="chat-input-row">
      <textarea id="ai-input" placeholder="Твой вопрос..." rows="2"></textarea>
      <button class="btn" onclick="sendAI()" style="height:48px">▶</button>
    </div>
  </div>

</div>

<!-- ── НИЖНИЕ ВКЛАДКИ ── -->
<div class="tabs">
  <button class="tab active" onclick="switchTab('search', this, '🔍 Поиск')">
    <span class="tab-icon">🔍</span>Поиск
  </button>
  <button class="tab" onclick="switchTab('orders', this, '📋 Заказы')">
    <span class="tab-icon">📋</span>Заказы
  </button>
  <button class="tab" onclick="switchTab('info', this, '🏪 Склады')">
    <span class="tab-icon">🏪</span>Склады
  </button>
  <button class="tab" onclick="switchTab('ai', this, '🤖 AI-чат')">
    <span class="tab-icon">🤖</span>AI-чат
  </button>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  function switchTab(id, btn, title) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + id).classList.add('active');
    btn.classList.add('active');
    document.getElementById('header-title').textContent = title;
  }

  function send(type, data) {
    tg.sendData(JSON.stringify({ type, ...data }));
  }

  function doSearch() {
    const q = document.getElementById('search-input').value.trim();
    if (!q) return;
    send('search', { query: q });
  }

  // Enter в поле поиска
  document.getElementById('search-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
  });

  // ── AI чат (вопрос → бот → ответ в чате, но сначала показываем локально) ──
  const chatEl = document.getElementById('chat-messages');

  function appendMsg(text, role) {
    const d = document.createElement('div');
    d.className = 'msg ' + role;
    d.textContent = text;
    chatEl.appendChild(d);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function sendAI() {
    const input = document.getElementById('ai-input');
    const text = input.value.trim();
    if (!text) return;
    appendMsg(text, 'user');
    input.value = '';

    // Показываем "печатает..."
    const typing = document.createElement('div');
    typing.className = 'msg bot';
    typing.textContent = '⏳ Отправляю в бот...';
    chatEl.appendChild(typing);
    chatEl.scrollTop = chatEl.scrollHeight;

    // Небольшая задержка чтобы пользователь увидел сообщение
    setTimeout(() => {
      send('ai', { message: text });
    }, 600);
  }

  document.getElementById('ai-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendAI(); }
  });
</script>
</body>
</html>
